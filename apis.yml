aid: photoneo
name: Photoneo
description: >-
  Photoneo is a Slovak (Bratislava, founded 2013) machine-vision company and a
  global pioneer of high-resolution structured-light 3D measurement. Its flagship
  products are the PhoXi 3D Scanner family and the MotionCam-3D, a parallel
  structured-light camera that captures moving scenes in real-time 3D, together
  with AI-enabled software such as Bin Picking Studio, Locator, and Palletizing
  for robotic automation. Rather than a hosted web/REST API, Photoneo exposes a
  developer surface through the PhoXi Control software and its official C++, C#,
  and Python device APIs, GenICam/GigE Vision standard connectivity, TCP/IP robot
  interfaces (UR, ABB, FANUC, Staubli, Mitsubishi, Kawasaki, Yaskawa), and a set
  of BSD-licensed example repositories on GitHub. Documentation lives in the
  Photoneo Knowledge Base (docs.photoneo.com) and the 3D scanning wiki. Photoneo
  (now part of the Brightpick Group) was acquired by Zebra Technologies.
